name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: node build.js

      - name: Check API token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"

      # 管理后台（admin.whizzzest.com，admin/ 目录独立 worker）
      - name: Deploy admin
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: admin

      # 商户门户（merchant.whizzzest.com，merchant/ 目录独立 worker）
      - name: Deploy merchant portal
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 67e59aecb10a2a8b4b4d525ff8ddcb56
          wranglerVersion: "4.129.0"
          workingDirectory: merchant
