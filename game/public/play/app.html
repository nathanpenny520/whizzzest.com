<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150a05">
  <meta name="robots" content="noindex"><!-- 运行页无独立内容，收录集中在游戏库 -->
  <title data-i18n="play.title">焰境之梦</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/game.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="/" data-i18n-aria="play.back" data-i18n-href="play.backHref" aria-label="返回游戏库">←</a>
    <div class="tb-title" id="tbTitle" data-i18n="play.tbTitle">焰境游戏</div>
    <button class="tb-btn" id="btnPad" hidden data-i18n="play.pad">手柄</button>
    <button class="tb-btn" id="btnSaves" data-i18n="play.saves">存档</button>
    <button class="tb-btn" id="btnFullscreen" data-i18n="play.fullscreen">全屏</button>
  </header>

  <div class="persist-banner" id="persistBanner" hidden>
    <span data-i18n="play.persistBanner">浏览器未授予持久化存储：空间紧张时本地存档可能被清理，建议定期「导出存档」备份。</span>
    <button id="persistClose" data-i18n-aria="play.closeHint" aria-label="关闭提醒">✕</button>
  </div>

  <main class="stage-wrap">
    <div id="stage"></div>
    <div id="padHost"></div>
  </main>

  <div id="orientHint" hidden data-i18n-html="play.orient">建议横屏游玩<br>（横屏可获得完整视野与操作空间）</div>

  <aside class="save-drawer" id="saveDrawer" hidden>
    <h3 data-i18n-html="play.saveDrawer">存档 <small>本地 IndexedDB · 断网可玩 · 云备份即将上线</small></h3>
    <div id="slotGrid"></div>
    <div class="drawer-io">
      <button class="btn-mini" id="btnExport" data-i18n="play.exportAll">导出全部（.wsave）</button>
      <button class="btn-mini" id="btnImport" data-i18n="play.import">导入 .wsave</button>
    </div>
    <p class="storage-line" id="storageLine"></p>
  </aside>

  <div id="toastBox"></div>

  <dialog id="confirmDlg">
    <h4 id="dlgTitle"></h4>
    <p id="dlgBody"></p>
    <div class="dlg-ops">
      <button class="btn-mini" id="dlgCancel" data-i18n="play.cancel">取消</button>
      <button class="btn-mini btn-danger" id="dlgOk" style="color:#fff;background:var(--c-accent);border-color:transparent" data-i18n="play.ok">确定</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept=".wsave,application/json" hidden>

  <div class="boot" id="bootState" hidden></div>

  <script type="module" src="/assets/js/game-shell.js"></script>
</body>
</html>
