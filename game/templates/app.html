<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#150a05">
  <meta name="robots" content="noindex"><!-- 运行页无独立内容，收录集中在游戏库 -->
  <title>{{t.play.title}}</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/game.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="{{t.play.backHref}}" aria-label="{{t.play.back}}">←</a>
    <div class="tb-title" id="tbTitle">{{t.play.tbTitle}}</div>
    <button class="tb-btn" id="btnPad" hidden>{{t.play.pad}}</button>
    <button class="tb-btn" id="btnSaves">{{t.play.saves}}</button>
    <button class="tb-btn" id="btnFullscreen">{{t.play.fullscreen}}</button>
  </header>

  <div class="persist-banner" id="persistBanner" hidden>
    <span>{{t.play.persistBanner}}</span>
    <button id="persistClose" aria-label="{{t.play.closeHint}}">✕</button>
  </div>

  <main class="stage-wrap">
    <div id="stage"></div>
    <div id="padHost"></div>
  </main>

  <div id="orientHint" hidden>{{t.play.orient}}</div>

  <aside class="save-drawer" id="saveDrawer" hidden>
    <h3>{{t.play.saveDrawer}}</h3>
    <div id="slotGrid"></div>
    <div class="drawer-io">
      <button class="btn-mini" id="btnExport">{{t.play.exportAll}}</button>
      <button class="btn-mini" id="btnImport">{{t.play.import}}</button>
    </div>
    <p class="storage-line" id="storageLine"></p>
  </aside>

  <div id="toastBox"></div>

  <dialog id="confirmDlg">
    <h4 id="dlgTitle"></h4>
    <p id="dlgBody"></p>
    <div class="dlg-ops">
      <button class="btn-mini" id="dlgCancel">{{t.play.cancel}}</button>
      <button class="btn-mini btn-danger" id="dlgOk" style="color:#fff;background:var(--c-accent);border-color:transparent">{{t.play.ok}}</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept=".wsave,application/json" hidden>

  <div class="boot" id="bootState" hidden></div>

  <script type="module" src="/assets/js/game-shell.js"></script>
</body>
</html>
