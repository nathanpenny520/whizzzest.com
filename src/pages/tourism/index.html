<!-- {"title":"旅游线路 — 焰境·万载","description":"古城文化之旅、山水文化之旅、红色文化之旅——万载古城、竹山洞、九龙原始森林，逐站行程安排。","ogImage":"/assets/img/wanzai_travelling.jpeg"} -->
<!DOCTYPE html>
<html lang="{{page.htmlLang}}">
{{> head}}
<body>
  {{> header}}
  <main id="main">

    <section class="hero hero-inner">
      <div class="hero-bg" aria-hidden="true">
        <img src="/assets/img/{{data.hero.img}}" alt="" loading="eager" fetchpriority="high">
      </div>
      <div class="hero-content">
        <h1>{{data.hero.title}}</h1>
        <p class="hero-sub">{{data.hero.subtitle}}</p>
      </div>
    </section>

    <section class="section">
      <div class="container-wide">
        <div class="section-head reveal">
          <h2>{{data.routesTitle}}</h2>
        </div>
        <div class="grid" style="gap: 48px;">
          {{#each data.routes as route}}
          <article class="route-card reveal">
            <img class="route-media" src="/assets/img/{{route.img}}" alt="{{route.name}}" loading="lazy" decoding="async" {{#if route.ar}}style="aspect-ratio:{{route.ar}}"{{/if}}>
            <div class="route-body">
              <h3>{{route.name}}</h3>
              <p class="route-desc">{{route.description}}</p>
              <ol class="stops">
                {{#each route.stops as stop}}
                <li>
                  <span class="stop-no">{{stop.order}}</span>
                  <div>
                    <h4>{{stop.name}}</h4>
                    <p>{{stop.desc}}</p>
                  </div>
                </li>
                {{/each}}
              </ol>
            </div>
          </article>
          {{/each}}
        </div>
      </div>
    </section>

  </main>
  {{> footer}}
</body>
</html>
