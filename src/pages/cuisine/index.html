<!-- {"title":"美食特产 — 焰境·万载","description":"万载六大碗、百合、罗城扎粉、南酸枣糕、番鸭……赣西山水的馈赠，品味万载特色美食与物产。","ogImage":"/assets/img/liudawan.jpeg"} -->
<!DOCTYPE html>
<html lang="zh-CN">
{{> head}}
<body>
  {{> header}}
  <main id="main">

    <section class="hero-flat">
      <h1>{{data.hero.title}}</h1>
      <p class="hero-sub">{{data.hero.subtitle}}</p>
    </section>

    <section class="section" style="padding-top: 24px;">
      <div class="container">
        <article class="split reveal">
          <div class="split-media">
            <img src="/assets/img/{{data.featured.img}}" alt="{{data.featured.title}}" loading="eager" decoding="async">
          </div>
          <div class="split-body">
            <span class="kicker">宴席之魂</span>
            <h3>{{data.featured.title}}</h3>
            {{#each data.featured.paras as p}}<p>{{p}}</p>{{/each}}
          </div>
        </article>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container-wide">
        <div class="section-head reveal">
          <h2>赣西风味</h2>
          <p>山珍河鲜、古法手作，万载的物产清单。</p>
        </div>
        <div class="grid grid-3">
          {{#each data.dishes as d}}
          <div class="card reveal">
            <img class="card-media" src="/assets/img/{{d.img}}" alt="{{d.title}}" loading="lazy" decoding="async">
            <div class="card-body">
              <h3>{{d.title}}</h3>
              {{#each d.paras as p}}<p>{{p}}</p>{{/each}}
            </div>
          </div>
          {{/each}}
        </div>
      </div>
    </section>

  </main>
  {{> footer}}
</body>
</html>
