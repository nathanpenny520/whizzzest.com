<!DOCTYPE html>
<html lang="{{page.htmlLang}}">
{{> head}}
<body>
  {{> header}}
  <main id="main">

    <section class="hero hero-inner">
      <div class="hero-bg" aria-hidden="true">
        <img src="/assets/img/{{data.hero.img}}" alt="" loading="eager" fetchpriority="high">
      </div>
      <div class="hero-content">
        <h1>{{data.hero.title}}</h1>
        <p class="hero-sub">{{data.hero.subtitle}}</p>
      </div>
    </section>

    {{#each data.groups as group}}
    <section class="section{{#if_odd}} section-alt{{/if_odd}}">
      <div class="container-wide">
        <div class="section-head reveal">
          <h2>{{group.title}}</h2>
        </div>
        <div class="masonry">
          {{#each group.dishes as d}}
          <div class="card reveal">
            <img class="card-media" src="/assets/img/{{d.img}}" alt="{{d.title}}" loading="lazy" decoding="async" {{#if d.ar}}style="aspect-ratio:{{d.ar}}"{{/if}}>
            <div class="card-body">
              <h3>{{d.title}}</h3>
              {{#each d.paras as p}}<p>{{p}}</p>{{/each}}
            </div>
          </div>
          {{/each}}
        </div>
      </div>
    </section>
    {{/each}}

    <section class="cta-band">
      <div class="reveal">
        <h2>{{data.cta.title}}</h2>
        <p>{{data.cta.desc}}</p>
        <a class="btn" href="{{data.cta.href}}">{{data.cta.btn}}</a>
      </div>
    </section>

  </main>
  {{> footer}}
</body>
</html>
