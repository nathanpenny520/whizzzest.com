<!DOCTYPE html>
<html lang="{{page.htmlLang}}">
{{> head}}
<body>
  {{> header}}
  <main id="main">

    <section class="hero hero-inner">
      <div class="hero-bg" aria-hidden="true">
        <img src="/assets/img/{{data.hero.img}}" alt="" loading="eager" fetchpriority="high">
      </div>
      <div class="hero-content">
        <h1>{{data.hero.title}}</h1>
        <p class="hero-sub">{{data.hero.subtitle}}</p>
      </div>
    </section>

    <section class="section">
      <div class="container-wide">
        <div class="section-head reveal">
          <h2>{{data.itemsTitle}}</h2>
          <p>{{data.itemsDesc}}</p>
        </div>
        <div class="grid grid-3">
          {{#each data.items as item}}
          <a class="feature-card reveal" href="{{page.urlPrefix}}heritage/{{item.key}}/">
            <span class="feature-no">{{item.badge}}</span>
            <h3>{{item.title}}</h3>
            <p>{{item.summary}}</p>
            <span class="card-go">{{t.common.readMore}}</span>
          </a>
          {{/each}}
        </div>
      </div>
    </section>

    <section class="cta-band section-alt">
      <div class="reveal">
        <h2>{{data.cta.title}}</h2>
        <p>{{data.cta.desc}}</p>
        <a class="btn" href="{{data.cta.href}}">{{data.cta.btn}}</a>
      </div>
    </section>

  </main>
  {{> footer}}
</body>
</html>
